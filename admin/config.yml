backend:
  name: github
  repo: iSDA-Africa/isda-new-website  # Path to GitHub repository
  branch: main
  base_url: https://public-website-cms-oauth-client-665342871462.europe-west1.run.app
  auth_endpoint: cloud_run/auth
  auth_scope: repo
site_url: https://isda-africa.com
show_preview_links: false
logo:
  src: /iSDA_Logo_Master_Pos_RGB.svg
  alt: iSDA Logo
publish_mode: editorial_workflow
media_folder: /assets/img/post
public_folder: /img/post
asset_collections:
  - name: website_images
    label: Website Images
    media_folder: /assets/img
    public_folder: /img
  - name: wordpress_images
    label: Legacy WordPress Images
    media_folder: /assets/wp-content
    public_folder: /wp-content
collections:
  - name: "posts"
    label: "Posts"
    label_singular: "post"
    folder: content/posts
    create: true
    path: "{{slug}}"
    preview_path: "/posts/{{slug}}"
    media_folder: /assets/img/post
    public_folder: /img/post
    fields:
      - label: Title
        name: title
        widget: string
      - label: Publish Date
        name: date
        widget: datetime
      - label: Featured Image
        name: image
        widget: image
      - label: Tags
        name: tags
        widget: relation
        multiple: true
        collection: tags
        search_fields: [title]
        display_fields: [title]
        value_field: '{{slug}}'
        required: false
      - label: Body
        name: body
        widget: markdown
  - name: tags
    label: Tags
    label_singular: Tag
    folder: content/tags
    create: true
    editor:
      preview: false
    nested:
      depth: 2
      subfolders: true
    meta:
      path:
        index_file: _index
    preview_path: '/tags/{{slug}}/'
    fields:
      - label: Name
        name: title
        widget: string
  - name: team
    label: Team Members
    label_singular: Team Member
    folder: data/team/members
    extension: yaml
    format: yaml
    create: true
    delete: true
    identifier_field: name
    summary: '{{name}} — {{title}}'
    sortable_fields: [name, title, team]
    media_folder: /assets/img/team
    public_folder: /img/team
    editor:
      preview: true
    fields:
      - label: Name
        name: name
        widget: string
      - label: Job Title
        name: title
        widget: string
      - label: Team
        name: team
        widget: select
        required: false
        options:
          - { label: Agronomy, value: agronomy }
          - { label: Digital, value: digital }
          - { label: Last Mile, value: last-mile }
          - { label: Operations, value: operations }
          - { label: Board, value: board }
      - label: Board Chair
        name: chair
        widget: boolean
        default: false
        required: false
        hint: Applies only to members of the Board.
      - label: Profile Photo
        name: img
        widget: image
        required: false
        hint: The website uses a placeholder if no photo is selected.
      - label: Biography
        name: bio
        widget: text
      - label: LinkedIn URL
        name: linkedin
        widget: string
        required: false
        pattern: ['^https://[^\s]+$', 'Enter a full HTTPS URL.']
      - label: Careers Testimonial
        name: testimonial
        widget: text
        required: false
        hint: Optional quote displayed on the careers page.
      - label: Testimonial Photo
        name: testimonial_img
        widget: image
        required: false
