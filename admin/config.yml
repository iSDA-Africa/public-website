backend:
  name: github
  repo: iSDA-Africa/isda-new-website  # Path to GitHub repository
  branch: main
  base_url: https://public-website-cms-oauth-client-665342871462.europe-west1.run.app
  auth_endpoint: cloud_run/auth
  auth_scope: repo
site_url: https://isda-africa.com
show_preview_links: false
logo:
  src: /iSDA_Logo_Master_Pos_RGB.svg
  alt: iSDA Logo
publish_mode: editorial_workflow
media_folder: /assets/img/post
public_folder: /img/post
collections:
  - name: "posts"
    label: "Posts"
    label_singular: "post"
    folder: content/posts
    create: true
    path: "{{slug}}"
    preview_path: "/posts/{{slug}}"
    media_folder: /assets/img/post
    public_folder: /img/post
    fields:
      - label: Title
        name: title
        widget: string
      - label: Publish Date
        name: date
        widget: datetime
      - label: Featured Image
        name: image
        widget: image
      - label: Tags
        name: tags
        widget: relation
        multiple: true
        collection: tags
        search_fields: [title]
        display_fields: [title]
        value_field: '{{slug}}'
        required: false
      - label: Body
        name: body
        widget: markdown
  - name: tags
    label: Tags
    label_singular: Tag
    folder: content/tags
    create: true
    editor:
      preview: false
    nested:
      depth: 2
      subfolders: true
    meta:
      path:
        index_file: _index
    preview_path: '/tags/{{slug}}/'
    fields:
      - label: Name
        name: title
        widget: string
